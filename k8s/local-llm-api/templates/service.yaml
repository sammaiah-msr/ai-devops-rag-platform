apiVersion: v1
kind: Service
metadata:
  name: {{ include "local-llm-api.fullname" . }}
  labels:
    {{- include "local-llm-api.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "local-llm-api.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 8000