replicaCount: 1

ingestion:
  enabled: true

image:
  repository: ghcr.io/sammaiah-msr/ai-devops-rag-platform
  tag: v2
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

route:
  enabled: false

monitoring:
  enabled: false
  
ai:
  provider: "ollama"

  openai:
    llmModel: "gpt-5.6-luna"
    embedModel: "text-embedding-3-small"

ollama:
  baseUrl: "http://host.docker.internal:11434"

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 20