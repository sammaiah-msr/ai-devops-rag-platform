replicaCount: 1

image:
  repository: ghcr.io/sammaiah-msr/ai-devops-rag-platform
  tag: v3
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ai:
  provider: "openai"

  openai:
    llmModel: "gpt-5.6-luna"
    embedModel: "text-embedding-3-small"

ollama:
  baseUrl: "http://host.docker.internal:11434"

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi

ingestion:
  enabled: false

route:
  enabled: true

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 20