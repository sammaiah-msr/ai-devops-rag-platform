apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-devops-rag
  template:
    metadata:
      labels:
        app: ai-devops-rag
    spec:
      containers:
        - name: ai-devops-rag
          image: ai-devops-rag:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          
          env:
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-devops-rag-config
                  key: OLLAMA_BASE_URL

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20