name: Build and Push Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/sammaiah-msr/ai-devops-rag-platform:${{ github.sha }} \
            .

      - name: Push image
        run: |
          docker push \
            ghcr.io/sammaiah-msr/ai-devops-rag-platform:${{ github.sha }}