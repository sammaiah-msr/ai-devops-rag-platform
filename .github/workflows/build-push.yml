name: Build and Push Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/sammaiah-msr/ai-devops-rag-platform:${{ github.sha }} \
            .

      - name: Push image
        run: |
          docker push \
            ghcr.io/sammaiah-msr/ai-devops-rag-platform:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/oc
          oc version --client

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login to OpenShift
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          oc login "$OPENSHIFT_SERVER" \
            --token="$OPENSHIFT_TOKEN" \
            --insecure-skip-tls-verify=true

      - name: Deploy to OpenShift
        env:
          OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          helm upgrade --install ai-devops-rag ./k8s/local-llm-api \
            -f ./k8s/local-llm-api/values-openshift.yaml \
            --set image.tag="${GITHUB_SHA}" \
            --set ingestion.enabled=false \
            -n "$OPENSHIFT_NAMESPACE"

      - name: Verify rollout
        env:
          OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          oc rollout status deployment/ai-devops-rag-local-llm-api \
            -n "$OPENSHIFT_NAMESPACE" \
            --timeout=180s

      - name: Verify public health endpoint
        env:
          OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          ROUTE=$(oc get route ai-devops-rag-local-llm-api \
            -n "$OPENSHIFT_NAMESPACE" \
            -o jsonpath='{.spec.host}')

          echo "Testing application health..."

          curl --fail \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://${ROUTE}/health"

          echo
          echo "Application health check passed"

      - name: Verify RAG endpoint
        env:
          OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          ROUTE=$(oc get route ai-devops-rag-local-llm-api \
            -n "$OPENSHIFT_NAMESPACE" \
            -o jsonpath='{.spec.host}')

          echo "Testing RAG endpoint..."

          RESPONSE=$(curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            -X POST "https://${ROUTE}/rag" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "What does CrashLoopBackOff mean?"
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"mode":"rag"'
          echo "$RESPONSE" | grep -q '"provider":"openai"'

          echo "RAG smoke test passed"